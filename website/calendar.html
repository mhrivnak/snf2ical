<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnF Schedule – Calendar View</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ical.js/build/ical.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6/index.global.min.js"></script>
    <style>
      /* Reset simple.css table styles inside the FullCalendar container so they
         don't interfere with FullCalendar's own rendering. */
      #calendar table,
      #calendar thead,
      #calendar tbody,
      #calendar tr,
      #calendar th,
      #calendar td {
        border: unset;
        padding: unset;
        text-align: unset;
        background: unset;
      }

      #filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      #filters label {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        cursor: pointer;
        font-size: 0.9rem;
      }

      #event-dialog {
        max-width: 28rem;
        width: 90%;
        border-radius: 6px;
        padding: 1.5rem;
      }

      #event-dialog::backdrop {
        background: rgba(0,0,0,0.4);
      }

      #event-dialog h3 {
        margin-top: 0;
      }

      #event-dialog dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.25rem 0.75rem;
        margin: 0.75rem 0 1rem;
      }

      #event-dialog dt {
        font-weight: bold;
        white-space: nowrap;
      }

      #event-dialog dd {
        margin: 0;
      }

      #event-dialog .close-btn {
        float: right;
        margin-top: -0.25rem;
      }
    </style>
</head>
<body>
  <header>
    <nav>
      <a href="/">Home</a>
      <a href="/calendar.html">Calendar</a>
      <a href="/details.html">Details</a>
    </nav>

    <h1>SnF Schedule</h1>
    <p>Usable calendars for the Sun 'n Fun Aerospace Expo</p>
  </header>

  <main>
    <div id="filters">
      <label><input type="checkbox" data-source="forums"        checked> Forums</label>
      <label><input type="checkbox" data-source="workshops"     checked> Workshops</label>
      <label><input type="checkbox" data-source="presentations" checked> Interviews &amp; Presentations</label>
      <label><input type="checkbox" data-source="facilities"    checked> Facilities</label>
      <label><input type="checkbox" data-source="other"         checked> Other</label>
    </div>
    <div id="calendar"></div>
  </main>

  <dialog id="event-dialog">
    <button class="close-btn" onclick="this.closest('dialog').close()">&#x2715;</button>
    <h3 id="event-title"></h3>
    <dl>
      <dt>Time</dt>     <dd id="event-time"></dd>
      <dt>Location</dt> <dd id="event-location"></dd>
      <dt>Type</dt>     <dd id="event-type"></dd>
      <dt>Speaker</dt>  <dd id="event-speaker"></dd>
      <dt>Track</dt>    <dd id="event-track"></dd>
    </dl>
    <p id="event-note" style="display:none; font-style:italic; font-size:0.9rem;"></p>
  </dialog>

  <footer>
    <p>Copyright &copy; 2026 Michael Hrivnak</p>
  </footer>

  <script>
    (async () => {
      const sources = {
        forums:        { url: '/ical/forums.ics',        color: '#1a73e8', label: 'Forums' },
        workshops:     { url: '/ical/workshops.ics',     color: '#e67c00', label: 'Workshops' },
        presentations: { url: '/ical/presentations.ics', color: '#0f9d58', label: 'Interviews & Presentations' },
        facilities:    { url: '/ical/facilities.ics',    color: '#9e9e9e', label: 'Facilities' },
        other:         { url: '/ical/other.ics',         color: '#7b1fa2', label: 'Other' },
      };

      let initialDate = new Date().toISOString().slice(0, 10);
      try {
        const res = await fetch('/ical/meta.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const meta = await res.json();
        if (meta.expoStart) initialDate = meta.expoStart;
      } catch (e) {
        console.warn('Could not load meta.json, defaulting initialDate to today:', e);
      }

      // Parse the DESCRIPTION field written by AsICS():
      //   "Type: ...\nTrack: ...\nSpeaker: ...\n\nNOTE: ..."
      function parseDesc(raw = '') {
        const fields = {};
        let note = '';
        for (const line of raw.split('\n')) {
          const m = line.match(/^([^:]+):\s*(.*)/);
          if (m) {
            const key = m[1].trim();
            if (key === 'NOTE') note = line;
            else fields[key] = m[2].trim();
          }
        }
        return { fields, note };
      }

      function fmtRange(start, end) {
        const opts = { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' };
        const s = start.toLocaleTimeString([], opts);
        if (!end) return s;
        const e = end.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        return `${s} – ${e}`;
      }

      const dialog = document.getElementById('event-dialog');

      const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: 'timeGridWeek',
        initialDate: initialDate,
        headerToolbar: {
          left:   'prev,next today',
          center: 'title',
          right:  'timeGridWeek,timeGridDay',
        },
        eventSources: Object.entries(sources).map(([id, s]) => ({
          id:     id,
          url:    s.url,
          format: 'ics',
          color:  s.color,
        })),
        eventClick: function(info) {
          const ev = info.event;
          const { fields, note } = parseDesc(ev.extendedProps.description);
          document.getElementById('event-title').textContent    = ev.title;
          document.getElementById('event-time').textContent     = fmtRange(ev.start, ev.end);
          document.getElementById('event-location').textContent = ev.extendedProps.location || '—';
          document.getElementById('event-type').textContent     = fields['Type']    || '—';
          document.getElementById('event-speaker').textContent  = fields['Speaker'] || '—';
          document.getElementById('event-track').textContent    = fields['Track']   || '—';
          const noteEl = document.getElementById('event-note');
          noteEl.textContent  = note;
          noteEl.style.display = note ? '' : 'none';
          dialog.showModal();
        },
      });
      calendar.render();

      // Close dialog on backdrop click.
      dialog.addEventListener('click', e => {
        if (e.target === dialog) dialog.close();
      });

      // Checkbox filtering: remove or re-add event sources by ID.
      document.querySelectorAll('#filters input[type=checkbox]').forEach(cb => {
        cb.addEventListener('change', () => {
          const id  = cb.dataset.source;
          const src = sources[id];
          if (cb.checked) {
            calendar.addEventSource({ id, url: src.url, format: 'ics', color: src.color });
          } else {
            calendar.getEventSourceById(id)?.remove();
          }
        });
      });
    })();
  </script>
</body>
</html>
